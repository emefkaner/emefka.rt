<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ausmisten — Fotos sortieren</title>
<meta name="description" content="Fotos und Videos per Wischen sortieren: behalten, archivieren, Favoriten, ähnliche Bilder vergleichen, Speicher freigeben. Läuft lokal im Browser.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ausmisten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6efe3;
  --card:#fffaf2;
  --card-2:#f1e7d6;
  --ink:#2a211a;
  --ink-2:#6d5f52;
  --ink-3:#a39483;
  --line:#e7dccb;
  --keep:#2f9e5b;
  --keep-soft:rgba(47,158,91,.14);
  --arch:#e0483e;
  --arch-soft:rgba(224,72,62,.13);
  --fav:#f2a516;
  --fav-soft:rgba(242,165,22,.16);
  --acc:#e0483e;
  --shadow:0 10px 30px rgba(70,45,20,.12);
  --shadow-s:0 2px 8px rgba(70,45,20,.08);
  --r:20px;
  --sans:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f;--card:#221d18;--card-2:#2b241d;--ink:#f3ebe0;--ink-2:#b5a796;--ink-3:#7c6f61;--line:#342c24;
    --keep-soft:rgba(47,158,91,.22);--arch-soft:rgba(224,72,62,.22);--fav-soft:rgba(242,165,22,.2);
    --shadow:0 10px 30px rgba(0,0,0,.4);--shadow-s:0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f;--card:#221d18;--card-2:#2b241d;--ink:#f3ebe0;--ink-2:#b5a796;--ink-3:#7c6f61;--line:#342c24;
  --keep-soft:rgba(47,158,91,.22);--arch-soft:rgba(224,72,62,.22);--fav-soft:rgba(242,165,22,.2);
  --shadow:0 10px 30px rgba(0,0,0,.4);--shadow-s:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
h1,h2,h3{margin:0;line-height:1.15}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:560px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
.view{display:none}
.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Kopf ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow-s);font-weight:700;font-size:14px;border:0}
.ring{position:relative;width:34px;height:34px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800}
.h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:24px 2px 10px}

/* ---------- Bausteine ---------- */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-s);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--card-2);font-weight:700}
.btn.primary{background:var(--acc);color:#fff}
.btn.keep{background:var(--keep);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn svg{width:20px;height:20px;flex:none}
.stack{display:grid;gap:10px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:13px}
.bar{height:6px;border-radius:9px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--keep);border-radius:9px;transition:width .3s}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:700}

/* ---------- Start ---------- */
.hero{text-align:center;padding:28px 18px}
.hero .art{width:150px;height:130px;margin:0 auto 14px;position:relative}
.hero .art div{position:absolute;inset:10px 25px;border-radius:16px;box-shadow:var(--shadow)}
.hero .art div:nth-child(1){background:var(--arch);transform:rotate(-14deg) translateX(-24px)}
.hero .art div:nth-child(2){background:var(--fav);transform:rotate(10deg) translateX(22px)}
.hero .art div:nth-child(3){background:var(--keep);display:grid;place-items:center;color:#fff}
.hero h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.hero p{margin:0 auto 20px;max-width:360px}
.drop{margin-top:14px;border:2px dashed var(--line);border-radius:16px;padding:14px;color:var(--ink-3);font-size:13px}
body.dragging .drop{border-color:var(--acc);color:var(--acc)}

.lib{display:flex;align-items:center;gap:14px}
.lib .num{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.lib .grow{flex:1;min-width:0}
.lib .src{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coll{position:relative;text-align:left;border:0;border-radius:18px;padding:14px;background:var(--card);box-shadow:var(--shadow-s);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .12s}
.coll:active{transform:scale(.97)}
.coll .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px}
.coll b{font-size:15px;display:block}
.coll small{color:var(--ink-3);font-size:13px}
.coll.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.coll.wide .grow{flex:1}

.year{font-size:20px;font-weight:800;margin:20px 2px 8px}
.months{display:grid;gap:8px}
.month{display:flex;align-items:center;gap:12px;border:0;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow-s);text-align:left;width:100%}
.month .tile{width:52px;height:52px;border-radius:12px;flex:none}
.month .grow{flex:1;min-width:0}
.month b{display:block;font-size:16px}
.month .bar{margin-top:6px}
.month .pc{font-size:13px;font-weight:800;color:var(--ink-3);min-width:42px;text-align:right}
.month.done .pc{color:var(--keep)}

/* ---------- Kacheln ---------- */
.tile{position:relative;background:var(--card-2);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.tile.ready img{opacity:1}
.tile.vid::after{content:"";position:absolute;right:6px;bottom:6px;width:0;height:0;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile.noimg::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:16px;overflow:hidden}
.grid .tile{aspect-ratio:1;border:0;padding:0;display:block;width:100%}
.grid .tile.sel{outline:3px solid var(--acc);outline-offset:-3px}
.grid .tile.sel::before{content:"✓";position:absolute;top:6px;right:6px;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.grid .tile .star{position:absolute;left:5px;top:3px;color:var(--fav);font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:1}

.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.vh h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.vh p{margin:2px 0 0;color:var(--ink-2)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty .e{font-size:44px;margin-bottom:6px}
.note{background:var(--fav-soft);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));width:min(528px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);z-index:20}
.selbar span{flex:1;font-weight:700}
.selbar .btn{background:rgba(255,255,255,.14);color:inherit}
:root[data-theme="dark"] .selbar .btn{background:rgba(0,0,0,.12)}

/* ---------- Fortschritt ---------- */
.big3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow-s)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat small{color:var(--ink-3);font-size:13px}
.streak{display:flex;align-items:center;gap:16px}
.streak .fl{font-size:46px;line-height:1}
.streak b{font-size:34px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.goalrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card-2)}
.heat i.l1{background:rgba(47,158,91,.35)}.heat i.l2{background:rgba(47,158,91,.6)}.heat i.l3{background:rgba(47,158,91,.85)}.heat i.l4{background:var(--keep)}
.heat i.today{outline:2px solid var(--ink);outline-offset:-1px}
.rowlist{display:grid;gap:8px}

/* ---------- Tableiste ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));z-index:10}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink-3);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab .bd{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--arch);color:#fff;font-size:11px;line-height:18px}

/* ---------- Wischen ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + var(--safe-t)) 0 calc(14px + var(--safe-b))}
.overlay .head{display:flex;align-items:center;gap:10px;padding:0 14px;max-width:560px;width:100%;margin:0 auto}
.overlay .head h3{flex:1;font-size:17px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow-s);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.count{min-width:42px;text-align:right;font-weight:800;font-size:14px;color:var(--ink-2)}
.swprog{max-width:528px;width:calc(100% - 32px);margin:10px auto 0}
.deck{position:relative;flex:1;max-width:560px;width:100%;margin:6px auto 0;min-height:0}
.card{position:absolute;inset:8px 16px;border-radius:24px;overflow:hidden;background:#111;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;cursor:grab}
.card.under{transform:scale(.94) translateY(14px);opacity:.75;pointer-events:none;transition:transform .25s,opacity .25s}
.card .media{position:absolute;inset:0}
.card .media .bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(28px) saturate(1.2);opacity:.55}
.card .media .ph,.card .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.card .media.broken::after{content:attr(data-msg);position:absolute;inset:0;display:grid;place-items:center;color:#ddd;padding:30px;text-align:center}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;pointer-events:none}
.card .meta b{display:block;font-size:17px}
.card .meta span{font-size:13px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta .fv{color:var(--fav)}
.stamp{position:absolute;top:26px;padding:4px 12px;border:4px solid;border-radius:12px;font-size:26px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;opacity:0;pointer-events:none;background:rgba(0,0,0,.25)}
.stamp.keep{left:20px;color:#4fd486;border-color:#4fd486;transform:rotate(-12deg)}
.stamp.arch{right:20px;color:#ff6b61;border-color:#ff6b61;transform:rotate(12deg)}
.stamp.fav{left:50%;top:40%;transform:translate(-50%,-50%);border:0;background:none;font-size:110px;color:var(--fav);text-shadow:0 4px 20px rgba(0,0,0,.4)}
.actions{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 0 2px}
.round{border:0;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .12s}
.round:active:not(:disabled){transform:scale(.9)}
.round svg{width:28px;height:28px}
.round.l{width:68px;height:68px}
.round.s{width:50px;height:50px}
.round.s svg{width:22px;height:22px}
.round.arch{color:var(--arch)}
.round.keep{color:var(--keep)}
.round.fav{color:var(--fav)}
.round.undo{color:var(--ink-2)}
.hint{text-align:center;font-size:12px;color:var(--ink-3);padding-top:8px}
.summary{position:absolute;inset:8px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.summary .e{font-size:60px}
.summary h2{font-size:30px;font-weight:800}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px;margin:8px 0}
.sumgrid div{background:var(--card);border-radius:16px;padding:12px 6px;font-size:13px;color:var(--ink-2)}
.sumgrid b{display:block;font-size:24px;color:var(--ink)}
.summary .stack{width:100%;max-width:380px}
.burst{position:absolute;left:50%;top:45%;font-size:120px;color:var(--fav);pointer-events:none;z-index:5;animation:burst .7s ease-out forwards;text-shadow:0 4px 20px rgba(0,0,0,.35)}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}

/* ---------- Vergleich ---------- */
.cmpbody{flex:1;overflow:auto;max-width:560px;width:100%;margin:10px auto 0;padding:0 16px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;background:#111;aspect-ratio:3/4;box-shadow:var(--shadow-s);outline:4px solid var(--keep);outline-offset:-4px;transition:opacity .15s}
.cmp img{width:100%;height:100%;object-fit:contain;display:block}
.cmp .tag{position:absolute;left:8px;top:8px;padding:3px 10px;border-radius:99px;background:var(--keep);color:#fff;font-size:12px;font-weight:800}
.cmp .inf{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:12px;text-align:left}
.cmp.arch{outline-color:var(--arch)}
.cmp.arch img{opacity:.45}
.cmp.arch .tag{background:var(--arch)}
.cmpfoot{display:flex;gap:10px;max-width:560px;width:100%;margin:12px auto 0;padding:0 16px}
.cmpfoot .btn{flex:1}

/* ---------- Dialoge ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,12,6,.45);display:grid;place-items:center;padding:20px;animation:fade .15s}
.dlg{background:var(--card);border-radius:24px;padding:22px;width:min(400px,100%);box-shadow:var(--shadow)}
.dlg h3{font-size:20px;font-weight:800;margin-bottom:8px}
.dlg p{margin:0 0 18px;color:var(--ink-2)}
.dlg .row{display:flex;gap:10px}
.dlg .row .btn{flex:1}
.btn.danger{background:var(--arch);color:#fff}
.freed{text-align:center}
.freed .e{font-size:56px}
.freed .n{font-size:44px;font-weight:900;letter-spacing:-.03em;color:var(--keep)}
#busy .dlg{text-align:center}
#busy .bar{margin-top:14px}
.spin{width:36px;height:36px;margin:0 auto 12px;border-radius:50%;border:4px solid var(--card-2);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .card{inset:8px 40px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== Sortieren ===== -->
  <section class="view on" data-view="home">
    <div class="top">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#e0483e"/><rect x="14" y="16" width="26" height="34" rx="6" fill="#fff" opacity=".55" transform="rotate(-12 27 33)"/><rect x="24" y="14" width="26" height="34" rx="6" fill="#fff"/><path d="M30 31l5 5 9-10" stroke="#2f9e5b" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1>Ausmisten</h1>
      </div>
      <button class="pill" id="streakPill" data-goto="stats" title="Serie">🔥 <span>0</span></button>
      <button class="ring" id="goalRing" data-goto="stats" title="Tagesziel" style="border:0;background:none;padding:0"></button>
    </div>
    <div id="homeBody"></div>
  </section>

  <!-- ===== Archiv ===== -->
  <section class="view" data-view="archive"><div id="archiveBody"></div></section>

  <!-- ===== Favoriten ===== -->
  <section class="view" data-view="favs"><div id="favsBody"></div></section>

  <!-- ===== Fortschritt ===== -->
  <section class="view" data-view="stats"><div id="statsBody"></div></section>
</div>

<nav class="tabbar" aria-label="Bereiche">
  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="13" height="17" rx="3"/><path d="M3 7v11a3 3 0 0 0 3 3h9"/></svg>Sortieren</button>
  <button class="tab" data-tab="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>Archiv<span class="bd hidden" id="archBadge"></span></button>

<script>
'use strict';
/* =====================================================================
   Ausmisten — Fotos und Videos per Wischen sortieren.
   Alles läuft lokal im Browser; Dateien werden nirgendwohin geladen.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const MEDIA_RE = /\.(jpe?g|png|gif|webp|avif|heic|heif|bmp|tiff?|mp4|mov|m4v|webm|3gp)$/i;
const VIDEO_RE = /\.(mp4|mov|m4v|webm|3gp)$/i;
const SHOT_RE = /(screenshot|screen[ _-]?shot|bildschirmfoto|bildschirmaufnahme|screen[ _-]?recording|capture)/i;
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const HAS_FS = typeof window.showDirectoryPicker === 'function';
const GOALS = [20, 50, 100, 200];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => n.toLocaleString('de-DE');
function fmtBytes(b){
  if (b < 1024) return b + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
  return b.toLocaleString('de-DE', {maximumFractionDigits: b < 10 ? 1 : 0}) + ' ' + u[i];
}
const pad2 = n => String(n).padStart(2, '0');
function dayKey(t = Date.now()){ const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function monthKey(t){ const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
const fmtDate = t => new Date(t).toLocaleDateString('de-DE', {day:'numeric', month:'long', year:'numeric'});
const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
const plural = (n, one, many) => fmtNum(n) + ' ' + (n === 1 ? one : many);

async function runPool(list, n, fn){
  let i = 0;
  const worker = async () => { while (i < list.length){ const k = i++; await fn(list[k], k); } };
  await Promise.all(Array.from({length: Math.min(n, list.length)}, worker));
}

/* ---------- Speicher: IndexedDB als einfacher Schlüssel-Wert-Speicher ---------- */
const DB = (() => {
  let dbp = null;
  function open(){
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('ausmisten', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e){ rej(e); }
    });
    return dbp;
  }
  async function get(k){
    try {
      const db = await open();
      return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch (e){ return undefined; }
  }
  async function set(k, v){
    try {
      const db = await open();
      await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e){}
  }
  return {get, set};
})();

/* ---------- Zustand ---------- */
const S = {
  items: [],          // geladene Medien, neueste zuerst
  byId: new Map(),
  dec: {},            // id -> {s:'keep'|'archive'|'gone', f:Favorit, t:Zeit}
  stats: {days: {}, freed: 0, deleted: 0, goal: 50},
  source: null,       // {kind:'dir'|'files'|'demo', name}
  sel: {archive: new Set(), favs: new Set()},
  savedDir: null,
};
let saveTimer = 0;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function saveNow(){ clearTimeout(saveTimer); DB.set('dec', S.dec); DB.set('stats', S.stats); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

const live = () => S.items.filter(i => !S.dec[i.id] || S.dec[i.id].s !== 'gone');
const isUnsorted = i => !S.dec[i.id];
const archived = () => S.items.filter(i => S.dec[i.id] && S.dec[i.id].s === 'archive');
const kept = () => S.items.filter(i => S.dec[i.id] && S.dec[i.id].s === 'keep');
const favs = () => S.items.filter(i => S.dec[i.id] && S.dec[i.id].f && S.dec[i.id].s === 'keep');

function decide(item, s, fav){
  const prev = S.dec[item.id];
  S.dec[item.id] = {s, f: !!fav || (s === 'keep' && !!(prev && prev.f)), t: Date.now()};
  const k = dayKey();
  S.stats.days[k] = (S.stats.days[k] || 0) + 1;
  if (S.stats.days[k] === S.stats.goal) setTimeout(() => toast('Tagesziel erreicht! 🎉'), 350);
  saveSoon();
  return {id: item.id, prev, day: k};
}
function undoDecision(h){
  if (h.prev) S.dec[h.id] = h.prev; else delete S.dec[h.id];
  S.stats.days[h.day] = Math.max(0, (S.stats.days[h.day] || 1) - 1);
  saveSoon();
}
function streak(){
  const days = S.stats.days; let n = 0;
  const d = new Date(); d.setHours(12, 0, 0, 0);
  if (!days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (days[dayKey(d)] > 0){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function longestStreak(){
  const keys = Object.keys(S.stats.days).filter(k => S.stats.days[k] > 0).sort();
  let best = 0, cur = 0, prev = null;
  for (const k of keys){
    const t = new Date(k + 'T12:00:00').getTime();
    cur = prev !== null && Math.round((t - prev) / 864e5) === 1 ? cur + 1 : 1;
    best = Math.max(best, cur); prev = t;
  }
  return best;
}

/* ---------- Aufnahmedatum: EXIF, sonst Dateiname, sonst Änderungsdatum ---------- */
async function exifDate(file){
  if (!/\.jpe?g$/i.test(file.name) && file.type !== 'image/jpeg') return null;
  const v = new DataView(await file.slice(0, 196608).arrayBuffer());
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  let o = 2;
  while (o + 4 <= v.byteLength){
    const m = v.getUint16(o);
    if ((m & 0xFF00) !== 0xFF00 || m === 0xFFDA) return null;
    const len = v.getUint16(o + 2);
    if (m === 0xFFE1 && o + 10 <= v.byteLength && v.getUint32(o + 4) === 0x45786966) return parseTiff(v, o + 10);
    o += 2 + len;
  }
  return null;
}
function parseTiff(v, t){
  if (t + 8 > v.byteLength) return null;
  const le = v.getUint16(t) === 0x4949;
  const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
  const ifd = off => {
    const p = t + off, out = [];
    if (p + 2 > v.byteLength) return out;
    const n = u16(p);
    for (let i = 0; i < n; i++){
      const e = p + 2 + i * 12;
      if (e + 12 > v.byteLength) break;
      out.push({tag: u16(e), count: u32(e + 4), val: u32(e + 8), e});
    }
    return out;
  };
  const str = en => {
    const off = en.count > 4 ? t + en.val : en.e + 8;
    if (off + en.count > v.byteLength) return null;
    let s = '';
    for (let i = 0; i < en.count - 1; i++) s += String.fromCharCode(v.getUint8(off + i));
    return s;
  };
  const ifd0 = ifd(u32(t + 4));
  let dt = null;
  const ptr = ifd0.find(e => e.tag === 0x8769);
  if (ptr){ const ex = ifd(ptr.val); const d = ex.find(e => e.tag === 0x9003) || ex.find(e => e.tag === 0x9004); if (d) dt = str(d); }
  if (!dt){ const d = ifd0.find(e => e.tag === 0x0132); if (d) dt = str(d); }
  const m = dt && /^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/.exec(dt);
  if (!m || +m[1] < 1971) return null;
  return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
}
function nameDate(name){
  const m = /(19[89]\d|20[0-4]\d)[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])(?:[-_ .T]?([01]\d|2[0-3])[-_.]?([0-5]\d)[-_.]?([0-5]\d))?/.exec(name);
  if (!m) return null;
  const t = new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 12), +(m[5] || 0), +(m[6] || 0)).getTime();
  return t <= Date.now() + 864e5 ? t : null;
}

/* ---------- Vorschaubilder und Bild-Fingerabdruck (dHash) ---------- */
const TH = {cache: new Map(), pending: new Map(), q: [], active: 0};
function ensureThumb(item){
  if (TH.cache.has(item.id)) return Promise.resolve(TH.cache.get(item.id));
  if (TH.pending.has(item.id)) return TH.pending.get(item.id);
  const p = new Promise(res => { TH.q.push({item, res}); pumpThumbs(); });
  TH.pending.set(item.id, p);
  return p;
}
function pumpThumbs(){
  while (TH.active < 3 && TH.q.length){
    const {item, res} = TH.q.shift();
    TH.active++;
    buildThumb(item).catch(() => null).then(u => {
      TH.active--; TH.cache.set(item.id, u); TH.pending.delete(item.id); res(u); pumpThumbs();
    });
  }
}
function loadImg(file){
  return new Promise(res => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 3000); };
    im.onerror = () => { URL.revokeObjectURL(u); res(null); };
    im.src = u;
  });
}
function coverDraw(src, w, h, size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const sc = Math.max(size / w, size / h);
  c.getContext('2d').drawImage(src, (size - w * sc) / 2, (size - h * sc) / 2, w * sc, h * sc);
  return c;
}
const toBlobUrl = (c, q) => new Promise(res => c.toBlob(b => res(b ? URL.createObjectURL(b) : null), 'image/jpeg', q));
async function buildThumb(item){
  if (item.video) return videoThumb(item);
  let src = null;
  try { src = await createImageBitmap(item.file); } catch (e){ src = await loadImg(item.file); }
  if (!src) return null;
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  if (!w || !h) return null;
  item.w = w; item.h = h;
  // Fingerabdruck aus waagrechtem und senkrechtem Helligkeitsgefälle, zusammen 128 Bit.
  const hc = document.createElement('canvas'); hc.width = 9; hc.height = 9;
  const hx = hc.getContext('2d', {willReadFrequently: true});
  hx.drawImage(src, 0, 0, 9, 9);
  const d = hx.getImageData(0, 0, 9, 9).data;
  const lum = (x, y) => { const p = (y * 9 + x) * 4; return d[p] * .299 + d[p + 1] * .587 + d[p + 2] * .114; };
  const hash = [0, 0, 0, 0];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++){
    const b = y * 8 + x;
    if (lum(x, y) > lum(x + 1, y)) hash[b >> 5] = (hash[b >> 5] | (1 << (b & 31))) >>> 0;
    if (lum(x, y) > lum(x, y + 1)) hash[2 + (b >> 5)] = (hash[2 + (b >> 5)] | (1 << (b & 31))) >>> 0;
  }
  item.hash = hash;
  const url = await toBlobUrl(coverDraw(src, w, h, 240), .8);
  if (src.close) src.close();
  return url;
}
function videoThumb(item){
  return new Promise(res => {
    const u = URL.createObjectURL(item.file), v = document.createElement('video');
    let done = false;
    const fin = r => { if (done) return; done = true; URL.revokeObjectURL(u); v.removeAttribute('src'); v.load(); res(r); };
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.onloadeddata = () => { try { v.currentTime = Math.min(.5, (v.duration || 1) / 3); } catch (e){ fin(null); } };
    v.onseeked = () => {
      try { toBlobUrl(coverDraw(v, v.videoWidth, v.videoHeight, 240), .75).then(fin); } catch (e){ fin(null); }
    };
    v.onerror = () => fin(null);
    setTimeout(() => fin(null), 8000);
    v.src = u;
  });
}
function popcnt(x){ x -= (x >>> 1) & 0x55555555; x = (x & 0x33333333) + ((x >>> 2) & 0x33333333); return (((x + (x >>> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24; }
const hamming = (a, b) => popcnt(a[0] ^ b[0]) + popcnt(a[1] ^ b[1]) + popcnt(a[2] ^ b[2]) + popcnt(a[3] ^ b[3]);

const tileIO = 'IntersectionObserver' in window
  ? new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting){ tileIO.unobserve(e.target); fillTile(e.target); } }, {rootMargin: '400px'})
  : null;
function fillTile(el){
  const it = S.byId.get(el.dataset.id);
  if (!it) return;
  ensureThumb(it).then(u => {
    if (u){ el.querySelector('img').src = u; el.classList.add('ready'); } else el.classList.add('noimg');
  });
}
function observeTiles(root){ $$('[data-thumb]', root).forEach(el => tileIO ? tileIO.observe(el) : fillTile(el)); }
const tileHtml = (it, tag = 'div', extra = '') =>
  `<${tag} class="tile${it.video ? ' vid' : ''}" data-thumb data-id="${esc(it.id)}"${tag === 'button' ? ' type="button"' : ''}>${extra}<img alt=""></${tag}>`;

/* ---------- Medien laden ---------- */
function resetLibrary(){
  for (const u of TH.cache.values()) if (u) URL.revokeObjectURL(u);
  TH.cache.clear(); TH.pending.clear(); TH.q.length = 0;
  S.items = []; S.byId = new Map(); S.source = null;
  S.sel.archive.clear(); S.sel.favs.clear();
}
async function loadEntries(entries, source){
  resetLibrary();
  busy('Mediathek wird gelesen…', 0, entries.length);
  const items = [], seen = new Set();
  for (const e of entries){
    const f = e.file;
    if (!MEDIA_RE.test(f.name) && !/^(image|video)\//.test(f.type)) continue;
    const id = (e.path || f.name) + '|' + f.size + '|' + f.lastModified;
    if (seen.has(id)) continue;
    seen.add(id);
    items.push({
      id, file: f, name: f.name, path: e.path || f.name, size: f.size, mtime: f.lastModified,
      video: VIDEO_RE.test(f.name) || f.type.startsWith('video/'),
      shot: SHOT_RE.test(e.path || f.name),
      dir: e.dir || null, date: f.lastModified, hash: null,
    });
  }
  let n = 0;
  await runPool(items, 6, async it => {
    let t = null;
    try { t = await exifDate(it.file); } catch (e){}
    it.date = t || nameDate(it.name) || it.mtime || Date.now();
    if (++n % 25 === 0) busy(null, n, items.length);
  });
  items.sort((a, b) => b.date - a.date);
  S.items = items;
  S.byId = new Map(items.map(i => [i.id, i]));
  S.source = source;
  busy(false);
  go('home');
  renderAll();
  if (!items.length) toast('Keine Fotos oder Videos gefunden');
}
async function walkDir(dir, path, out){
  for await (const [name, h] of dir.entries()){
    if (name.startsWith('.')) continue;
    if (h.kind === 'directory') await walkDir(h, path + name + '/', out);
    else if (MEDIA_RE.test(name)) out.push({h, dir, path: path + name});
  }
}
async function loadDir(dir){
  busy('Ordner wird durchsucht…');
  const found = [];
  try { await walkDir(dir, '', found); }
  catch (e){ busy(false); toast('Ordner konnte nicht gelesen werden'); return; }
  const entries = [];
  busy('Dateien werden geöffnet…', 0, found.length);
  let n = 0;
  await runPool(found, 8, async f => {
    try { entries.push({file: await f.h.getFile(), path: f.path, dir: f.dir}); } catch (e){}
    if (++n % 50 === 0) busy(null, n, found.length);
  });
  await loadEntries(entries, {kind: 'dir', name: dir.name});
}
async function openDir(){
  let dir;
  try { dir = await window.showDirectoryPicker({mode: 'readwrite', id: 'ausmisten'}); }
  catch (e){ if (e.name !== 'AbortError') toast('Ordner konnte nicht geöffnet werden'); return; }
  S.savedDir = dir;
  DB.set('dir', dir);
  await loadDir(dir);
}
async function resumeDir(){
  const dir = S.savedDir;
  if (!dir) return;
  try {
    let p = await dir.queryPermission({mode: 'readwrite'});
    if (p !== 'granted') p = await dir.requestPermission({mode: 'readwrite'});
    if (p === 'granted') await loadDir(dir); else toast('Zugriff nicht erlaubt');
  } catch (e){ toast('Ordner nicht mehr verfügbar'); }
}
function loadFileList(files, label){
  const list = [...files];
  if (!list.length) return;
  const first = list[0].webkitRelativePath ? list[0].webkitRelativePath.split('/')[0] : null;
  loadEntries(list.map(f => ({file: f, path: f.webkitRelativePath || f.name})),
    {kind: 'files', name: first || label || plural(list.length, 'Datei', 'Dateien')});
}

/* ---------- Demo-Mediathek: erzeugte Bilder, damit man ohne eigene Fotos probieren kann ---------- */
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function drawScene(seed, shift){
  const r = mulberry32(seed * 97 + 13), port = r() > .4;
  const W = port ? 900 : 1200, H = port ? 1200 : 900;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const hue = Math.floor(r() * 360);
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},70%,${55 + r() * 20}%)`);
  g.addColorStop(1, `hsl(${(hue + 40) % 360},80%,${80 + r() * 10}%)`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = `hsla(${(hue + 180) % 360},90%,85%,.95)`;
  x.beginPath(); x.arc(W * (.2 + r() * .6) + shift * 18, H * (.18 + r() * .2), 60 + r() * 70, 0, 7); x.fill();
  for (let L = 0; L < 3; L++){
    x.fillStyle = `hsl(${(hue + 150 + L * 12) % 360},${35 + L * 10}%,${42 - L * 11}%)`;
    const base = H * (.55 + L * .13), amp = 30 + r() * 60, fr = .004 + r() * .006, ph = r() * 6;
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 10) x.lineTo(px, base + Math.sin(px * fr + ph + shift * .05) * amp);
    x.lineTo(W, H); x.fill();
  }
  return new Promise(res => c.toBlob(res, 'image/jpeg', .85));
}
function drawShot(seed){
  const r = mulberry32(seed * 31 + 7), W = 750, H = 1334;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fafafa'; x.fillRect(0, 0, W, H);
  x.fillStyle = `hsl(${Math.floor(r() * 360)},60%,50%)`; x.fillRect(0, 0, W, 170);
  x.fillStyle = '#fff'; x.font = 'bold 44px sans-serif'; x.fillText(['Nachrichten', 'Wetter', 'Einkauf', 'Bahn', 'Mail', 'Notizen'][seed % 6], 40, 125);
  for (let i = 0; i < 9; i++){
    x.fillStyle = '#e4e4e4'; x.fillRect(40, 220 + i * 120, 90, 90);
    x.fillStyle = '#cfcfcf'; x.fillRect(160, 235 + i * 120, 300 + r() * 220, 22);
    x.fillStyle = '#e2e2e2'; x.fillRect(160, 275 + i * 120, 200 + r() * 200, 18);
  }
  return new Promise(res => c.toBlob(res, 'image/png'));
}
async function loadDemo(){
  busy('Demo wird erzeugt…', 0, 60);
  const files = [], now = Date.now(), r = mulberry32(42);
  for (let i = 0; i < 42; i++){
    let t = now - Math.floor(r() * 430) * 864e5 - Math.floor(r() * 864e5);
    if (i === 3) t = new Date(new Date().setFullYear(new Date().getFullYear() - 1)).getTime();
    const burst = i % 8 === 0 ? 3 : 1;
    for (let b = 0; b < burst; b++){
      const d = new Date(t + b * 2000);
      const name = `IMG_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.jpg`;
      files.push(new File([await drawScene(i, b)], name, {type: 'image/jpeg', lastModified: t + b * 2000}));
    }
    busy(null, files.length, 60);
  }
  for (let i = 0; i < 6; i++){
    const t = now - Math.floor(r() * 200) * 864e5, d = new Date(t);
    files.push(new File([await drawShot(i)], `Screenshot_${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}-${pad2(i)}.png`, {type: 'image/png', lastModified: t}));
  }
  await loadEntries(files.map(f => ({file: f, path: f.name})), {kind: 'demo', name: 'Demo-Mediathek'});
}

const SW = {queue: [], idx: 0, hist: [], busy: false, urls: new Map(), title: ''};

}
function urlFor(it){ let u = SW.urls.get(it.id); if (!u){ u = URL.createObjectURL(it.file); SW.urls.set(it.id, u); } return u; }
function releaseUrls(keep){ for (const [id, u] of SW.urls) if (!keep.has(id)){ URL.revokeObjectURL(u); SW.urls.delete(id); } }
function cardEl(it, top){
  const el = document.createElement('div');
  el.className = 'card ' + (top ? 'top' : 'under');
  const u = urlFor(it), d = S.dec[it.id];
  el.innerHTML = `<div class="media">${it.video
      ? `<video src="${u}" muted loop playsinline ${top ? 'autoplay' : ''} preload="metadata"></video>`
      : `<img class="bg" src="${u}" alt="" aria-hidden="true" draggable="false"><img class="ph" src="${u}" alt="${esc(it.name)}" draggable="false">`}</div>
    <div class="stamp keep">Behalten</div><div class="stamp arch">Archiv</div><div class="stamp fav">★</div>
    <div class="meta"><b>${d && d.f ? '<span class="fv">★</span> ' : ''}${fmtDate(it.date)}</b><span>${it.video ? 'Video · ' : ''}${fmtBytes(it.size)} · ${esc(it.path)}</span></div>`;
  const m = el.querySelector('.media');
  const fail = () => { m.classList.add('broken'); m.dataset.msg = 'Keine Vorschau für dieses Format möglich.\n' + it.name; };
  const ph = el.querySelector('.ph'); if (ph) ph.onerror = fail;
  const v = el.querySelector('video'); if (v) v.onerror = fail;
  return el;
}
function renderDeck(){
  const deck = $('#deck'), n = SW.queue.length;
  deck.innerHTML = '';
  const cur = SW.queue[SW.idx], nxt = SW.queue[SW.idx + 1], after = SW.queue[SW.idx + 2];
  $('#swCount').textContent = cur ? `${SW.idx + 1}/${n}` : '';
  $('#swBar').style.width = (SW.idx / n * 100) + '%';
  $('#swControls').classList.toggle('hidden', !cur);
  if (!cur){ releaseUrls(new Set()); renderSummary(); return; }
  if (nxt) deck.append(cardEl(nxt, false));
  const top = cardEl(cur, true);
  deck.append(top);
  bindCard(top, cur);
  releaseUrls(new Set([cur.id, nxt && nxt.id, after && after.id].filter(Boolean)));
  if (after && !after.video) new Image().src = urlFor(after);
  $('#swUndo').disabled = !SW.hist.length;
}
function renderSummary(){
  const done = SW.queue.slice(0, SW.idx);
  const k = done.filter(i => S.dec[i.id] && S.dec[i.id].s === 'keep').length;
  const a = done.filter(i => S.dec[i.id] && S.dec[i.id].s === 'archive');
  const f = done.filter(i => S.dec[i.id] && S.dec[i.id].f).length;
  const el = document.createElement('div');
  el.className = 'summary';
  el.innerHTML = `<div class="e">${a.length ? '🧺' : '🎉'}</div><h2>Geschafft!</h2>
    <p class="muted" style="margin:0">„${esc(SW.title)}“ ist durchsortiert.</p>
    <div class="sumgrid"><div><b>${k}</b>behalten</div><div><b>${a.length}</b>archiviert</div><div><b>${f}</b>Favoriten</div></div>
    ${a.length ? `<p class="muted" style="margin:0 0 6px">${fmtBytes(sum(a, i => i.size))} können freigegeben werden.</p>` : ''}
    <div class="stack">
      ${a.length ? '<button class="btn primary block" data-act="toArchive">Zum Archiv</button>' : ''}
      <button class="btn ${a.length ? 'ghost' : 'primary'} block" data-act="closeSwipe">Zur Übersicht</button>
      ${SW.hist.length ? '<button class="btn ghost block" data-act="undo">Letzte Entscheidung zurücknehmen</button>' : ''}
    </div>`;

function act(kind){
  const it = SW.queue[SW.idx];
  if (SW.busy || !it) return;
  SW.busy = true;
  SW.hist.push(decide(it, kind === 'archive' ? 'archive' : 'keep', kind === 'fav'));
  const card = $('#deck .card.top');
  if (card){
    const v = card.querySelector('video'); if (v) v.pause();
    card.querySelector(kind === 'archive' ? '.stamp.arch' : kind === 'fav' ? '.stamp.fav' : '.stamp.keep').style.opacity = 1;
    const dir = kind === 'archive' ? -1 : 1;
    card.style.transition = 'transform .3s cubic-bezier(.4,.1,.9,.6), opacity .3s';
    card.style.transform = `translate(${dir * 150}%, 40px) rotate(${dir * 22}deg)`;
    card.style.opacity = '0';
    const under = $('#deck .card.under');
    if (under){ under.style.transform = 'none'; under.style.opacity = '1'; }
  }
  setTimeout(() => { SW.idx++; SW.busy = false; renderDeck(); }, card ? 260 : 0);
}
function undo(){
  if (SW.busy || !SW.hist.length) return;
  undoDecision(SW.hist.pop());
  SW.idx = Math.max(0, SW.idx - 1);
  renderDeck();
  const c = $('#deck .card.top');
  if (c){ c.style.transition = 'none'; c.style.transform = 'translateY(-30px) scale(.96)'; c.style.opacity = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { c.style.transition = 'transform .25s, opacity .25s'; c.style.transform = ''; c.style.opacity = ''; })); }
}
function burst(){
  const b = document.createElement('div'); b.className = 'burst'; b.textContent = '★';
  $('#deck').append(b); setTimeout(() => b.remove(), 800);
}
function bindCard(card, it){
  const ks = card.querySelector('.stamp.keep'), as = card.querySelector('.stamp.arch');
  let st = null, lastTap = 0;
  card.addEventListener('pointerdown', e => {
    if (SW.busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
    st = {x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, dy: 0};
    try { card.setPointerCapture(e.pointerId); } catch (_){}
    card.style.transition = 'none';
  });
  card.addEventListener('pointermove', e => {
    if (!st) return;
    st.dx = e.clientX - st.x; st.dy = e.clientY - st.y;
    card.style.transform = `translate(${st.dx}px, ${st.dy * .35}px) rotate(${st.dx / 18}deg)`;
    const p = Math.min(1, Math.abs(st.dx) / 100);
    ks.style.opacity = st.dx > 0 ? p : 0; as.style.opacity = st.dx < 0 ? p : 0;
  });
  const end = e => {
    if (!st) return;
    const {dx, dy, t} = st; st = null;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t);
    if (Math.abs(dx) > 100 || (Math.abs(dx) > 40 && v > .6)){ act(dx > 0 ? 'keep' : 'archive'); return; }
    card.style.transition = 'transform .28s cubic-bezier(.2,.9,.3,1.25)';
    card.style.transform = ''; ks.style.opacity = as.style.opacity = 0;
    if (e.type !== 'pointerup' || Math.abs(dx) > 8 || Math.abs(dy) > 8) return;
    const now = performance.now();
    if (now - lastTap < 320){ lastTap = 0; burst(); act('fav'); return; }
    lastTap = now;
    if (it.video) setTimeout(() => {
      if (lastTap !== now) return;
      const vid = card.querySelector('video'); if (!vid) return;
      vid.muted = !vid.muted; vid.play().catch(() => {}); toast(vid.muted ? 'Ton aus' : 'Ton an');
    }, 330);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

/* ---------- Ähnliche Fotos vergleichen ---------- */
const CMP = {groups: [], gi: 0, state: new Map()};
async function findSimilar(){
  const imgs = live().filter(i => !i.video && isUnsorted(i));
  const todo = imgs.filter(i => !i.hash);
  if (todo.length){
    let n = 0;
    busy('Ähnliche Fotos werden gesucht…', 0, todo.length);
    await Promise.all(todo.map(it => ensureThumb(it).then(() => { if (++n % 5 === 0 || n === todo.length) busy(null, n, todo.length); })));
  }
  busy(false);
  const list = imgs.filter(i => i.hash).sort((a, b) => a.date - b.date);
  const par = list.map((_, i) => i);
  const find = x => { while (par[x] !== x){ par[x] = par[par[x]]; x = par[x]; } return x; };
  const unite = (a, b) => { par[find(a)] = find(b); };
  const exact = new Map();
  list.forEach((it, i) => {
    // Gleicher Fingerabdruck = Duplikat, egal wann. Ähnlich nur innerhalb von 30 Minuten (Serienbilder).
    const key = it.hash.join(':');
    if (exact.has(key)) unite(i, exact.get(key)); else exact.set(key, i);
    for (let j = i + 1; j < list.length && list[j].date - it.date <= 30 * 60e3; j++) if (hamming(it.hash, list[j].hash) <= 20) unite(i, j);
  });
  const g = new Map();
  list.forEach((it, i) => { const r = find(i); if (!g.has(r)) g.set(r, []); g.get(r).push(it); });
  CMP.groups = [...g.values()].filter(x => x.length > 1).map(x => x.sort((a, b) => b.size - a.size));
  CMP.gi = 0;
  if (!CMP.groups.length){ toast('Keine ähnlichen Fotos gefunden'); return; }
  $('#compare').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderCompare();
}
function renderCompare(){
  const grp = CMP.groups[CMP.gi];
  for (const u of CMP.urls || []) URL.revokeObjectURL(u);
  CMP.urls = [];
  if (!grp){ closeCompare(); toast('Alle Gruppen durchgesehen ✓'); return; }
  $('#cmpCount').textContent = `${CMP.gi + 1}/${CMP.groups.length}`;
  CMP.state = new Map(grp.map((it, i) => [it.id, i === 0 ? 'keep' : 'archive']));
  $('#cmpGrid').innerHTML = grp.map((it, i) => {
    const u = URL.createObjectURL(it.file); CMP.urls.push(u);
    return `<button class="cmp${i ? ' arch' : ''}" data-cid="${esc(it.id)}"><img src="${u}" alt=""><span class="tag">${i ? 'Archiv' : 'Behalten'}</span><span class="inf">${fmtBytes(it.size)}${it.w ? ` · ${it.w}×${it.h}` : ''}<br>${new Date(it.date).toLocaleString('de-DE', {dateStyle: 'medium', timeStyle: 'medium'})}</span></button>`;
  }).join('');
}
function closeCompare(){
  for (const u of CMP.urls || []) URL.revokeObjectURL(u);
  CMP.urls = [];
  $('#compare').classList.add('hidden');
  document.body.style.overflow = '';
  renderAll();
}

/* ---------- ZIP (ohne Kompression, Fotos sind ohnehin komprimiert) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(items){
  const enc = new TextEncoder(), parts = [], central = [], used = new Set();
  let off = 0, n = 0;
  for (const it of items){
    let name = it.name, k = 1;
    while (used.has(name.toLowerCase())) name = it.name.replace(/(\.[^.]*)?$/, m => ` (${k++})` + m);
    used.add(name.toLowerCase());
    const nb = enc.encode(name), size = it.file.size;
    const crc = crc32(new Uint8Array(await it.file.arrayBuffer()));
    const d = new Date(it.date), y = Math.max(1980, d.getFullYear());
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((y - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, nb.length, true);
    parts.push(lh, nb, it.file);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
    central.push(ch, nb);
    off += 30 + nb.length + size;
    busy(null, ++n, items.length);
  }
  const cdSize = sum(central, p => p.byteLength);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, items.length, true); end.setUint16(10, items.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end], {type: 'application/zip'});
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function zipDownload(list, name){
  if (!list.length){ toast('Nichts zum Herunterladen'); return; }
  busy('ZIP wird gepackt…', 0, list.length);
  try { download(await makeZip(list), name); } catch (e){ toast('ZIP konnte nicht erstellt werden'); }
  busy(false);
}

/* ---------- Archiv leeren ---------- */
async function emptyArchive(){
  const list = archived(), bytes = sum(list, i => i.size), real = S.source.kind === 'dir';
  const ok = await confirmDlg(`${plural(list.length, 'Medium', 'Medien')} löschen?`,
    real ? `Die Dateien werden endgültig aus „${esc(S.source.name)}“ gelöscht. Das lässt sich nicht rückgängig machen.`
         : 'Beispielmodus: Die Bilder werden nur aus der Sitzung entfernt.',
    `Löschen · ${fmtBytes(bytes)}`, true);
  if (!ok) return;
  busy('Wird gelöscht…', 0, list.length);
  let freed = 0, cnt = 0, fail = 0;
  const gone = new Set();
  for (const it of list){
    try {
      if (real) await it.dir.removeEntry(it.name);
      freed += it.size; cnt++; gone.add(it.id); delete S.dec[it.id];
      const u = TH.cache.get(it.id); if (u) URL.revokeObjectURL(u); TH.cache.delete(it.id);
    } catch (e){ fail++; }
    busy(null, cnt + fail, list.length);
  }
  S.items = S.items.filter(i => !gone.has(i.id));
  for (const id of gone) S.byId.delete(id);
  S.stats.freed += freed; S.stats.deleted += cnt;
  saveNow(); busy(false); renderAll();
  celebrate(freed, cnt, fail);
}
function celebrate(bytes, cnt, fail){
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="dlg freed"><div class="e">✨</div><div class="n">0 B</div><p>${plural(cnt, 'Medium', 'Medien')} gelöscht${fail ? ` · ${fail} nicht möglich` : ''}.<br>So viel Platz hast du gerade freigemacht.</p><button class="btn primary block">Super</button></div>`;
  document.body.append(s);
  const n = s.querySelector('.n'), t0 = performance.now();
  const tick = now => { const p = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - p, 3); n.textContent = fmtBytes(Math.round(bytes * e)); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  s.querySelector('button').onclick = () => s.remove();
}

/* ---------- Dialoge und Hinweise ---------- */
function confirmDlg(title, text, okLabel, danger){
  return new Promise(res => {
    const s = document.createElement('div'); s.className = 'scrim';
    s.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${text}</p><div class="row"><button class="btn ghost" data-r="0">Abbrechen</button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(okLabel)}</button></div></div>`;
    s.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b || e.target === s){ s.remove(); res(!!(b && b.dataset.r === '1')); } });
    document.body.append(s);
    s.querySelector('[data-r="1"]').focus();
  });
}
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function busy(text, n, total){
  const b = $('#busy');
  if (text === false){ b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  if (text) $('#busyText').textContent = text;
  if (total){ $('#busySub').textContent = `${fmtNum(n)} von ${fmtNum(total)}`; $('#busyBar').style.width = (n / total * 100) + '%'; $('#busyBar').parentElement.classList.remove('hidden'); }
  else if (text){ $('#busySub').textContent = ''; $('#busyBar').parentElement.classList.add('hidden'); }
}

/* ---------- Ereignisse ---------- */
const actions = {
  openDir, resume: resumeDir, demo: loadDemo,
  pickFiles: () => $('#pickFiles').click(),
  pickFolder: () => $('#pickFolder').click(),
  change: () => { resetLibrary(); go('home'); renderAll(); },
  similar: findSimilar,
  toArchive: () => { closeSwipe(); go('archive'); },
  closeSwipe, undo,
  empty: emptyArchive,
  archList: () => {
    const list = archived();
    download(new Blob([list.map(i => i.path).join('\n') + '\n'], {type: 'text/plain'}), 'archiv-zum-löschen.txt');
  },
  archGone: async () => {
    const list = archived();
    if (!await confirmDlg('Als erledigt markieren?', 'Die Medien verschwinden aus der App und tauchen auch beim nächsten Laden nicht mehr auf. Löschen musst du sie selbst in deiner Galerie.', 'Erledigt', true)) return;
    for (const it of list) S.dec[it.id] = {s: 'gone', f: false, t: Date.now()};
    S.stats.deleted += list.length; saveNow(); renderAll();
  },
  selAllArch: () => { const l = archived(), s = S.sel.archive; if (s.size === l.length) s.clear(); else l.forEach(i => s.add(i.id)); renderArchive(); },
  restore: () => { for (const id of S.sel.archive) delete S.dec[id]; toast(`${S.sel.archive.size} zurück zu den unsortierten`); S.sel.archive.clear(); saveSoon(); renderAll(); },
  keepSel: () => { for (const id of S.sel.archive) S.dec[id] = {s: 'keep', f: false, t: Date.now()}; S.sel.archive.clear(); saveSoon(); renderAll(); },
  unfav: () => { for (const id of S.sel.favs) if (S.dec[id]) S.dec[id].f = false; S.sel.favs.clear(); saveSoon(); renderAll(); },
  zipFavs: () => zipDownload(favs(), 'favoriten.zip'),
  zipKept: () => zipDownload(kept(), 'behalten.zip'),
  theme: () => {
    const cur = document.documentElement.dataset.theme, nx = !cur ? 'light' : cur === 'light' ? 'dark' : '';
    if (nx) document.documentElement.dataset.theme = nx; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('ausmisten-theme', nx); } catch (e){}
    renderStats();
  },
  reset: async () => {
    if (!await confirmDlg('Fortschritt zurücksetzen?', 'Alle Entscheidungen, Favoriten und die Serie werden gelöscht. Deine Dateien bleiben unberührt.', 'Zurücksetzen', true)) return;
    S.dec = {}; S.stats = {days: {}, freed: 0, deleted: 0, goal: S.stats.goal}; saveNow(); renderAll();
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-goto],[data-coll],[data-month],[data-goal],.grid .tile,.cmp');
  if (!t) return;
  if (t.dataset.act) return actions[t.dataset.act] && actions[t.dataset.act]();
  if (t.dataset.tab || t.dataset.goto){ go(t.dataset.tab || t.dataset.goto); return; }
  if (t.dataset.coll){
    const c = collections().find(x => x.k === t.dataset.coll);
    if (c) startSwipe(c.t, c.shuffle ? shuffled(c.list) : c.list);
    return;
  }
  if (t.dataset.month){ startSwipe(monthTitle(t.dataset.month), live().filter(i => monthKey(i.date) === t.dataset.month)); return; }
  if (t.dataset.goal){ S.stats.goal = +t.dataset.goal; saveSoon(); renderTop(); renderStats(); return; }
  if (t.classList.contains('cmp')){
    const id = t.dataset.cid, s = CMP.state.get(id) === 'keep' ? 'archive' : 'keep';
    CMP.state.set(id, s);
    t.classList.toggle('arch', s === 'archive');
    t.querySelector('.tag').textContent = s === 'keep' ? 'Behalten' : 'Archiv';
    return;
  }
  const view = t.closest('.view');
  if (view && t.dataset.id){
    const sel = S.sel[view.dataset.view];
    if (!sel) return;
    sel.has(t.dataset.id) ? sel.delete(t.dataset.id) : sel.add(t.dataset.id);
    view.dataset.view === 'archive' ? renderArchive() : renderFavs();
  }
});
$('#swClose').onclick = closeSwipe;
$('#swArch').onclick = () => act('archive');
$('#swKeep').onclick = () => act('keep');
$('#swFav').onclick = () => { if (SW.queue[SW.idx]){ burst(); act('fav'); } };
$('#swUndo').onclick = undo;
$('#cmpClose').onclick = closeCompare;
$('#cmpSkip').onclick = () => { CMP.gi++; renderCompare(); };
$('#cmpApply').onclick = () => {
  const grp = CMP.groups[CMP.gi];
  if (grp) for (const it of grp) if (isUnsorted(it)) decide(it, CMP.state.get(it.id), false);
  CMP.gi++; renderCompare();
};
$('#pickFiles').onchange = e => { loadFileList(e.target.files); e.target.value = ''; };
$('#pickFolder').onchange = e => { loadFileList(e.target.files); e.target.value = ''; };
document.addEventListener('keydown', e => {
  if ($('.scrim:not(.hidden):not(#busy)')) return;
  if (!$('#swipe').classList.contains('hidden')){
    if (e.key === 'ArrowLeft'){ e.preventDefault(); act('archive'); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); act('keep'); }
    else if (e.key === 'ArrowUp' || e.key === 'f'){ e.preventDefault(); if (SW.queue[SW.idx]){ burst(); act('fav'); } }
    else if (e.key === 'Backspace' || e.key === 'z'){ e.preventDefault(); undo(); }
    else if (e.key === 'Escape') closeSwipe();
  } else if (!$('#compare').classList.contains('hidden') && e.key === 'Escape') closeCompare();
});
let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (e.dataTransfer && e.dataTransfer.files.length) loadFileList(e.dataTransfer.files);
});

/* ---------- Start ---------- */
(async () => {
  try { const t = localStorage.getItem('ausmisten-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e){}
  const [dec, stats, dir] = await Promise.all([DB.get('dec'), DB.get('stats'), HAS_FS ? DB.get('dir') : undefined]);
  if (dec) S.dec = dec;
  if (stats) S.stats = Object.assign(S.stats, stats);
  if (dir) S.savedDir = dir;
  renderAll();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
