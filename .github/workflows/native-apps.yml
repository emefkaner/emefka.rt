name: Native Apps

on:
  push:
    paths:
      - 'dublicat/**'
      - 'dublicat-app/**'
      - '.github/workflows/native-apps.yml'
  pull_request:
    paths:
      - 'dublicat/**'
      - 'dublicat-app/**'
      - '.github/workflows/native-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS (unsignierte IPA)
    runs-on: macos-15
    defaults:
      run:
        working-directory: dublicat-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dublicat-app/package-lock.json

      - name: Abhaengigkeiten
        run: npm ci

      - name: Web-App in das iOS-Projekt kopieren
        run: npx cap sync ios

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry DUBLICAT-unsigniert.ipa Payload
          ls -la DUBLICAT-unsigniert.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DUBLICAT-iOS-unsigniert
          path: dublicat-app/DUBLICAT-unsigniert.ipa
          if-no-files-found: error

  android:
    name: Android (Debug-APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dublicat-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dublicat-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Abhaengigkeiten
        run: npm ci

      - name: Web-App in das Android-Projekt kopieren
        run: npx cap sync android

      - name: Bauen
        working-directory: dublicat-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DUBLICAT-Android-Debug
          path: dublicat-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
